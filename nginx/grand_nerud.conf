# grand_nerud — reverse proxy (HTTPS + HTTP/2, редирект с :80)
#
# Сертификаты: certbot certonly --nginx -d api.crm-grandnerudgroup.ru
#
# Установка:
#   sudo cp nginx/grand_nerud.conf /etc/nginx/sites-available/grand_nerud
#   sudo ln -sf /etc/nginx/sites-available/grand_nerud /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream grand_nerud_api {
    server 127.0.0.1:5007;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name api.crm-grandnerudgroup.ru;

    return 301 https://$host$request_uri;
}

# HTTPS + HTTP/2
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name api.crm-grandnerudgroup.ru;

    ssl_certificate /etc/letsencrypt/live/api.crm-grandnerudgroup.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.crm-grandnerudgroup.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    access_log /var/log/nginx/grand_nerud.access.log;
    error_log  /var/log/nginx/grand_nerud.error.log warn;

    client_max_body_size 20m;

    location = /health {
        access_log off;
        proxy_pass http://grand_nerud_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://grand_nerud_api;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Connection         "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
