services:
  grand_nerud:
    build:
      context: .
    container_name: grand_nerud_app
    env_file:
      - .env_prod
    command: [ '/grand_nerud/docker/app.sh' ]
    ports:
      - "5007:5003"
    restart: on-failure:10
    volumes:
      - ../uploads:/grand_nerud/uploads/
    depends_on:
      - mongo

  mongo:
    image: mongo
    container_name: mongodb_grand_nerud
    restart: always
    env_file:
      - .env_prod
    ports:
      - "27018:27017"
    volumes:
      - ../mongo_data_grand_nerud:/data/db
