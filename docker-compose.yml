services:
  grand_nerud:
    build:
      context: .
    container_name: grand_nerud_app
    env_file:
      - .env_prod
    command: [ '/grand_nerud/docker/app.sh' ]
    ports:
      - "5007:5003"
    restart: on-failure:10
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo
    container_name: mongodb_grand_nerud
    restart: always
    env_file:
      - .env_prod
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - ../mongo_data_grand_nerud:/data/db
